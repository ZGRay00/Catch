<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéCatch 保持激活</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>PokéCatch 保持激活</h1>
  <p id="status" role="status" aria-live="polite">正在读取状态…</p>
  <button id="enable" disabled>在当前游戏页开启</button>
  <button id="disable" class="secondary" disabled>关闭保持激活</button>
  <button id="retry" class="secondary" disabled>重新检查</button>
  <p id="support" class="note"></p>
  <p class="note">开启后可切换标签页或最小化，无需打开 F12。手动刷新后尝试恢复，重启浏览器后记住启用偏好；用户取消后须手动开启。一次只保持一个游戏页。</p>
  <p class="note">浏览器会显示调试提示。请保持电脑唤醒；游戏是否允许此方式尚未确认。</p>
  <script src="popup.js"></script>
</body>
</html>
